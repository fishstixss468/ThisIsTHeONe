<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archery Game</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(#87ceeb, #dff6ff);
    font-family: Arial;
}

canvas {
    display: block;
    cursor: crosshair;
}

#score {
    position: absolute;
    top: 10px;
    left: 120px;
    font-size: 20px;
    font-weight: bold;
    display: none;
}

#homeBtn {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 8px 12px;
    cursor: pointer;
    display: none;
}

#pauseBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 8px 12px;
    cursor: pointer;
    display: none;
}

#startScreen, #winScreen, #roundScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

#winScreen, #roundScreen {
    display: none;
}

button {
    padding: 10px 20px;
    margin-top: 15px;
}
</style>
</head>

<body>

<!-- ✅ HOME BUTTON FIXED -->
<a href="fromScratch.html">
    <button id="homeBtn">Home</button>
</a>

<button id="pauseBtn" onclick="pauseGame()">Pause</button>

<div id="score">Score: 0</div>

<div id="startScreen">
    <h2>Hit all targets to advance rounds!</h2>
    <button onclick="startGame()">Start</button>
</div>

<div id="roundScreen">
    <h2>Ready for the Next Round?</h2>
    <button onclick="nextRound()">Begin</button>
</div>

<div id="winScreen">
    <h1>You Won All 5 Rounds!</h1>
    <button onclick="restartGame()">Play Again</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;
let gamePaused = false;

let mouseX = canvas.width / 2;
let mouseY = canvas.height / 2;

let aiming = false;
let pullPower = 0;
let arrows = [];

let round = 1;
let targets = [];

const bow = {
    x: 150,
    y: canvas.height / 2
};

function startGame() {
    gameStarted = true;
    round = 1;
    createTargets();

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("score").style.display = "block";
    document.getElementById("homeBtn").style.display = "block";
    document.getElementById("pauseBtn").style.display = "block";
}

function createTargets() {
    targets = [];
    for (let i = 0; i < round; i++) {
        targets.push({
            x: canvas.width * (0.6 + Math.random() * 0.3),
            y: Math.random() * canvas.height,
            radius: 60,
            dx: 2 + Math.random() * 2,
            dy: 1.5 + Math.random() * 2
        });
    }
}

function nextRound() {
    document.getElementById("roundScreen").style.display = "none";
    createTargets();
}

function pauseGame() {
    gamePaused = !gamePaused;
}

canvas.addEventListener("mousedown", () => {
    if (!gameStarted || gamePaused) return;
    aiming = true;
});

canvas.addEventListener("mouseup", () => {
    if (!gameStarted || gamePaused) return;
    if (aiming) {
        shootArrow();
        aiming = false;
        pullPower = 0;
    }
});

canvas.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function shootArrow() {
    const angle = Math.atan2(mouseY - bow.y, mouseX - bow.x);

    arrows.push({
        x: bow.x,
        y: bow.y,
        vx: Math.cos(angle) * (10 + pullPower * 10),
        vy: Math.sin(angle) * (10 + pullPower * 10)
    });
}

function drawBow() {
    const angle = Math.atan2(mouseY - bow.y, mouseX - bow.x);

    ctx.save();
    ctx.translate(bow.x, bow.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.arc(0, 0, 100, -Math.PI/2, Math.PI/2);
    ctx.strokeStyle = "brown";
    ctx.lineWidth = 5;
    ctx.stroke();

    const pull = pullPower * 40;

    ctx.beginPath();
    ctx.moveTo(0, -100);
    ctx.lineTo(-pull, 0);
    ctx.lineTo(0, 100);
    ctx.strokeStyle = "black";
    ctx.stroke();

    if (aiming) {
        ctx.beginPath();
        ctx.moveTo(-pull, 0);
        ctx.lineTo(40 - pull, 0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(40 - pull, 0);
        ctx.lineTo(30 - pull, -5);
        ctx.lineTo(30 - pull, 5);
        ctx.fill();
    }

    ctx.restore();
}

function drawTargets() {
    targets.forEach(t => {
        const colors = ["white", "blue", "yellow", "red"];
        const radii = [60, 45, 30, 15];

        for (let i = 0; i < colors.length; i++) {
            ctx.beginPath();
            ctx.arc(t.x, t.y, radii[i], 0, Math.PI * 2);
            ctx.fillStyle = colors[i];
            ctx.fill();
        }
    });
}

function updateTargets() {
    targets.forEach(t => {
        t.x += t.dx;
        t.y += t.dy;

        if (t.x > canvas.width || t.x < canvas.width * 0.5) t.dx *= -1;
        if (t.y > canvas.height || t.y < 0) t.dy *= -1;
    });
}

function drawCrosshair() {
    ctx.beginPath();
    ctx.moveTo(mouseX - 8, mouseY);
    ctx.lineTo(mouseX + 8, mouseY);
    ctx.moveTo(mouseX, mouseY - 8);
    ctx.lineTo(mouseX, mouseY + 8);
    ctx.stroke();
}

function updateArrows() {
    arrows.forEach((arrow, i) => {
        arrow.vy += 0.2;
        arrow.x += arrow.vx;
        arrow.y += arrow.vy;

        ctx.fillRect(arrow.x, arrow.y, 20, 3);

        targets.forEach((t, ti) => {
            const dx = arrow.x - t.x;
            const dy = arrow.y - t.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist <= 15) {
                targets.splice(ti, 1);
                arrows.splice(i, 1);

                if (targets.length === 0) {
                    round++;

                    if (round > 5) {
                        document.getElementById("winScreen").style.display = "block";
                    } else {
                        document.getElementById("roundScreen").style.display = "block";
                    }
                }
            }
        });
    });
}

function updatePower() {
    if (aiming && pullPower < 1) pullPower += 0.02;
}

function restartGame() {
    round = 1;
    createTargets();
    document.getElementById("winScreen").style.display = "none";
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameStarted && !gamePaused) {
        updateTargets();
        drawTargets();
        drawBow();
        drawCrosshair();
        updatePower();
        updateArrows();
    }

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
